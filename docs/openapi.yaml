openapi: 3.1.0
info:
  title: Motiva API
  version: 1.0.0
  description: 'Проект контракта этапа 2 от 2026-09-13. Источники: BUSINESS 3.0, ENGINEERING 3.0, 03_AUTH, утверждённый
    docs/stage-1.md с отдельными дополнениями Q01–Q09. Реализации нет. Все пути /api/v1, компания и инициатор только
    из JWT. Все успешные DTO фиксированной формы, nullable-поля всегда присутствуют; application/json, ошибки application/problem+json.
    Перечисления регистрозависимы. Неизвестные поля/дроби/выход за диапазон — 400. Допустимые границы календаря
    Europe/Tallinn вычисляются до сравнения точных UTC моментов. PATCH application/json: отсутствующее поле не меняется,
    массив заменяется целиком; null разрешён только явно. ETag настроек всегда читается из PostgreSQL. Все POST,
    кроме progress-events и экономических операций с бессрочным бизнес-номером, требуют Idempotency-Key. Общие правила
    и механизмы: docs/stage-2.md.'
servers:
- url: http://localhost:8080/api/v1
  description: Изолированный локальный стенд; вне него HTTPS обязателен.
security:
- BearerAuth: []
